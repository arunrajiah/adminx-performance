name: WordPress Plugin CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Validate PHP syntax
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Check required plugin files
        run: |
          test -f readme.txt
          test -f includes/class-cache-manager.php

      - name: Build plugin zip
        run: |
          mkdir -p build/adminx-performance
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='docs' \
            --exclude='node_modules' \
            --exclude='vendor' \
            ./ build/adminx-performance/
          cd build
          zip -r adminx-performance.zip adminx-performance/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: adminx-performance
          path: build/adminx-performance.zip
